<main id="home">
  <div class="top">
    <div class="brand"><span>Poppy</span></div>
    <nav class="nav" aria-label="Main">
      <div class="pick-wrap">
        <select id="langSel" class="pick sm" aria-label="Language"><option value="en">English</option><option value="hi">हिंदी</option><option value="es">Español</option><option value="fr">Français</option></select>
        <svg class="pick-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      
      <button class="link" id="galBtn">Library</button>
      <button class="link" id="roadmapBtn">Roadmap</button>
      <button class="link" id="secTopBtn">Security</button>
      <button class="link connOpen">Connectors</button>
      <button class="link" id="settingsBtn"><span id="provLabel">Add a key</span></button>
      <img src="logo.png" alt="Poppy logo" class="top-nav-logo" id="topLogo">
    </nav>
  </div>
  <section class="hero">
    <div>
      <h1><span id="h1Line1">Say it.</span><br><span id="h1Line2" style="--d:.12s">Poppy builds it.</span></h1>
      <p class="lede" id="ledeText">Describe any website, game or tool. This page turns into it.</p>
      <div id="log" aria-live="polite"></div>
      <form class="ask" id="homeForm">
        <input id="prompt" placeholder="A pomodoro timer shaped like a lighthouse" autocomplete="off" aria-label="What should Poppy build?" autofocus spellcheck="false">
        <div id="atDropdown" class="at-dropdown" hidden></div>
        <button type="button" class="att" aria-label="Attach an image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button><button type="button" class="mic" aria-label="Hold to talk"><i></i><i></i><i></i><i></i></button><button class="go" id="go">Build</button>
      </form>
      <div class="opts"><label class="sw"><input type="checkbox" id="multiAgentOn" role="switch" checked><span class="trk"></span><span>Multi-Agent Engine</span></label><label class="sw" style="margin-left:8px"><input type="checkbox" id="planFirst" role="switch"><span class="trk"></span><span>Plan first</span></label><label class="sw" style="margin-left:8px"><input type="checkbox" id="agentOn" role="switch"><span class="trk"></span><span>Autonomous loop</span></label></div>
      <div class="opts" style="margin-top:12px">
  <div class="pick-wrap">
    <select id="tpl" class="pick" aria-label="Start from a template"><option>Start from anything</option></select>
    <svg class="pick-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </div>
  <div class="pick-wrap">
    <select id="sty" class="pick" aria-label="Visual style"><option>Any style</option></select>
    <svg class="pick-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </div>
</div>
      <div class="ideas" id="ideas"></div>
    </div>
    <div class="bloom" id="bloomWrap"><svg id="flower" viewBox="0 0 200 200" role="img" aria-label="Poppy flower"><use href="#fl"/></svg></div>
  </section>
</main>
