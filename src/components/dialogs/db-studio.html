<dialog id="dbStudioDlg" aria-labelledby="dbStudioT">
  <div class="dh">
    <h2 id="dbStudioT" style="display:flex;align-items:center;gap:10px">
      <span>Database Studio</span>
      <span id="dbStudioBadge" class="sec-badge sec-badge-conn">SQLite &amp; Store</span>
    </h2>
    <button class="x" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="db">
    <div class="tabs" id="dbStudioTabs">
      <button class="tab" data-tab="sql" aria-pressed="true">SQLite Tables (poppy.db)</button>
      <button class="tab" data-tab="kv">Key-Value (poppy.store)</button>
    </div>

    <!-- SQLite Tab -->
    <div id="dbStudioTabSql" class="inspect-panel">
      <div class="studio-toolbar">
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700">
          Table:
          <span class="pick-wrap">
            <select id="dbTableSelect" class="pick sm"></select>
            <svg class="pick-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </span>
        </label>
        <button class="go sm" id="dbAddRowBtn" type="button">+ Add Row</button>
        <button class="link sm" id="dbNewTableBtn" type="button">+ New Table</button>
        <button class="link sm" id="dbExportCsvBtn" type="button">Export CSV</button>
        <button class="link sm" id="dbImportCsvBtn" type="button">Import CSV</button>
        <input type="file" id="dbCsvIn" accept=".csv,text/csv" hidden>
        <button class="link sm del" id="dbDropTableBtn" type="button" style="margin-left:auto;color:var(--red)">Delete Table</button>
      </div>
      <div id="dbSchemaBar" style="font-size:.8rem;color:var(--sub);margin-bottom:8px"></div>
      <div class="studio-table-wrap">
        <table class="studio-table" id="dbStudioTable">
          <thead><tr id="dbStudioThead"></tr></thead>
          <tbody id="dbStudioTbody"></tbody>
        </table>
      </div>
      <p class="hint" style="margin-top:8px">Click any cell to edit inline. Changes update the database and trigger automations immediately.</p>
    </div>

    <!-- Key-Value Tab -->
    <div id="dbStudioTabKv" class="inspect-panel" style="display:none">
      <div class="studio-toolbar">
        <input class="in cs" id="dbKvSearch" type="search" placeholder="Filter keys..." style="flex:1;max-width:240px" autocomplete="off">
        <button class="go sm" id="dbAddKeyBtn" type="button">+ Add Key</button>
        <button class="link sm" id="dbRefreshKvBtn" type="button">Refresh</button>
      </div>
      <div class="studio-table-wrap">
        <table class="studio-table" id="dbKvTable">
          <thead>
            <tr>
              <th style="width:180px">Key</th>
              <th style="width:90px">Type</th>
              <th>Value</th>
              <th style="width:80px">Actions</th>
            </tr>
          </thead>
          <tbody id="dbKvTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="acts">
    <button class="go sp" id="dbStudioClose">Done</button>
  </div>
</dialog>
