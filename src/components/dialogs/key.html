<dialog id="dlg" aria-labelledby="dlgT"><div class="dh"><h2 id="dlgT">Pick your AI</h2><button class="x" type="button" aria-label="Close">&times;</button></div><div class="db"><p class="hint" id="dlgNote" style="margin-top:0;margin-bottom:12px">Runs in your browser. Needs an AI key. Nothing is stored on our servers.</p><div class="tabs" id="tabs"><button class="tab" data-p="anthropic">Anthropic</button><button class="tab" data-p="openai">OpenAI</button><button class="tab" data-p="gemini">Gemini</button><button class="tab" data-p="meta">Meta</button></div>
<label class="fld"><span>API key</span><input id="key" type="password" autocomplete="off"></label><label class="fld"><span>Model</span><input id="model" list="mlist" autocomplete="off"></label><datalist id="mlist"></datalist>
<p class="hint" id="meterLine"></p>
<label class="fld"><span>Daily token limit (0 means no limit)</span><input id="cap" type="number" min="0" step="10000" inputmode="numeric"></label>
<div class="opts" style="flex-direction:column;align-items:flex-start;gap:12px;margin:2px 0 16px"><label class="sw"><input type="checkbox" id="qaOn" role="switch"><span class="trk"></span><span>Test the site before showing it</span></label><label class="sw"><input type="checkbox" id="vrOn" role="switch"><span class="trk"></span><span>Design review from screenshots</span></label></div>
<p class="hint" id="hint" aria-live="polite"></p><button class="link sm" id="replayIntro" type="button" style="margin-top:6px;display:inline-block">Replay the intro</button><p class="hint">Keys stay in this browser and go only to the provider you pick. Keep this file private and don't host it publicly.</p></div><div class="acts"><button class="go" id="saveKey">Use this one</button><button class="link" id="testKey" type="button">Test key</button><button class="link sp" id="closeDlg">Cancel</button></div></dialog>
