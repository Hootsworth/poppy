<dialog id="blocksDlg" aria-labelledby="blocksT">
  <div class="dh">
    <h2 id="blocksT" style="display:flex;align-items:center;gap:10px">
      <span>UI Blocks ("LEGO")</span>
      <span class="lib-count-badge">8 blocks</span>
    </h2>
    <button class="x" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="db">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px">
      <div class="lib-folder-tabs" id="blockCatTabs">
        <button class="lib-tab active" data-cat="all" type="button">All</button>
        <button class="lib-tab" data-cat="hero" type="button">Hero</button>
        <button class="lib-tab" data-cat="features" type="button">Features</button>
        <button class="lib-tab" data-cat="pricing" type="button">Pricing</button>
        <button class="lib-tab" data-cat="social" type="button">Social Proof</button>
        <button class="lib-tab" data-cat="forms" type="button">Forms & Footer</button>
      </div>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600">
        Insert position:
        <span class="pick-wrap">
          <select id="blockInsertPos" class="pick sm">
            <option value="bottom">At the bottom</option>
            <option value="top">At the top (after header)</option>
            <option value="after_selected">After selected element</option>
          </select>
          <svg class="pick-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </label>
    </div>
    <div id="blocksGrid" class="gal-grid"></div>
  </div>
  <div class="acts">
    <button class="go sp" id="blocksClose">Close</button>
  </div>
</dialog>
