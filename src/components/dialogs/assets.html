<dialog id="assetsDlg" aria-labelledby="assetsT" style="width:min(640px,calc(100vw - 24px))"><div class="dh"><h2 id="assetsT">Assets Library</h2><button class="x" type="button" aria-label="Close">&times;</button></div><div class="db"><p class="hint">Upload images or generate them with AI. Sites load them using <code>poppy.asset("name")</code>. Assets live in this browser and are included in exports.</p><div class="acts" style="border:0;padding:0 0 12px;gap:8px"><button class="go sm" id="uploadAssetBtn" type="button">Upload image</button><button class="link sm" id="genAssetBtn" type="button">Generate with AI</button><input type="file" id="assetFileIn" accept="image/*,audio/*" hidden></div><div id="genAssetBox" class="cf" style="margin-bottom:12px;display:none"><label class="fld"><span>Prompt</span><input id="genAssetPrompt" placeholder="A retro pixel art robot" autocomplete="off"></label><label class="fld"><span>Filename</span><input id="genAssetFilename" placeholder="robot.png" autocomplete="off"></label><label class="fld"><span>Service</span><select id="genAssetService"><option value="openai">OpenAI (DALL-E)</option><option value="stability">Stability AI</option></select></label><div class="row2"><button class="go sm" id="genAssetGo" type="button">Generate</button><button class="link sm" id="genAssetCancel" type="button">Cancel</button></div><p class="hint st" id="genAssetSt"></p></div><div id="assetsGrid" class="assets-grid"></div></div><div class="acts"><button class="go sp" id="assetsClose" type="button">Done</button></div></dialog>
